[project]
name = "video-automation"
version = "1.5.2"
description = "Jianying / Doubao video automation skill pack (orchestrator + editor + tools)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pymediainfo>=6.0.0",
  "websockets>=12.0",
  "pillow>=10.0.0",
  "uiautomation>=2.0.0; sys_platform == 'win32'",
]

[dependency-groups]
# TTS 鍏滃簳銆佷簯鏇插簱銆佽繘绋嬭緟鍔╋紙缂轰簡涓婚摼浠嶅彲璺戯級
recommended = [
  "edge-tts>=6.1.0",
  "requests>=2.31.0",
  "psutil>=5.9.0",
]
# 瑙嗚鎷煎浘 / 鎶藉抚杈呭姪锛坴ision_analyzer 鎸夐渶 import锛?vision = [
  "numpy>=1.26.0",
  "opencv-python-headless>=4.8.0",
]
dev = []

[tool.uv]
package = false
default-groups = ["recommended", "vision"]

[tool.uv.pip]
# 涓庢湰鏈哄凡楠岃瘉鐨?Python 3.11 瀵归綈锛涚敤 `uv python pin` 鍐欏叆 .python-version
python-version = "3.11"


name: Offline regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: ${{ matrix.label }} / Windows Python 3.11
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Package
            directory: tests
          - label: Orchestrator
            directory: doubao-jianying-orchestrator/tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: packages/video-v1.5.3
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.6"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: packages/video-v1.5.3/uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Check CLI entrypoint
        if: matrix.label == 'Package'
        run: uv run --frozen python -X utf8 doubao-jianying-orchestrator/run.py --help
      - name: Check feature boundaries
        if: matrix.label == 'Package'
        run: uv run --frozen python -X utf8 -m tools.check_architecture
      - name: Check example JSON
        if: matrix.label == 'Package'
        run: uv run --frozen python -X utf8 -m json.tool examples/manifest.preview.json
      - name: Prepare portable FFmpeg for media fixtures
        run: |
          $setupJson = uv run --frozen python -X utf8 doubao-jianying-orchestrator/run.py setup-ffmpeg
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg preparation failed: $setupJson" }
          $setup = $setupJson | ConvertFrom-Json
          if (-not $setup.ffmpeg -or -not $setup.ffprobe) { throw "FFmpeg and ffprobe are required for media fixtures" }
          if (-not (Test-Path -LiteralPath $setup.ffmpeg) -or -not (Test-Path -LiteralPath $setup.ffprobe)) { throw "Prepared media binaries are missing" }
          (Split-Path -Parent $setup.ffmpeg) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FFMPEG_BIN=$($setup.ffmpeg)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFPROBE_BIN=$($setup.ffprobe)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run full suite
        run: uv run --frozen python -X utf8 -m unittest discover -s ${{ matrix.directory }} -q

  offline-windows:
    name: Windows Python 3.11
    if: ${{ always() }}
    needs: [suites]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both complete suites
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
        run: |
          if [ "$SUITES_RESULT" != "success" ]; then
            echo "Full Windows suites did not both pass: $SUITES_RESULT"
            exit 1
          fi

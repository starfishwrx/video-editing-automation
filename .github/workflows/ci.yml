name: Offline regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-windows:
    name: Windows Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: packages/video-v1.5.3
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.6"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: packages/video-v1.5.3/uv.lock
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Check CLI entrypoint
        run: uv run --frozen python -X utf8 doubao-jianying-orchestrator/run.py --help
      - name: Check example JSON
        run: uv run --frozen python -X utf8 -m json.tool examples/manifest.preview.json
      - name: Package tests
        run: uv run --frozen python -X utf8 -m unittest discover -s tests -q
      - name: Orchestrator tests
        run: uv run --frozen python -X utf8 -m unittest discover -s doubao-jianying-orchestrator/tests -q
